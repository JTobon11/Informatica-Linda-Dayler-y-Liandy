<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Formulario de registro</title>
<style>
:root{
  --bg:#f6f7fb;--surface:#fff;--text:#1d2433;--muted:#667085;--border:#dde1ea;
  --accent:#4f46e5;--accent-text:#fff;--danger:#d92d20;--row:#f1f3f9;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#12141c;--surface:#1b1e29;--text:#e8eaf2;--muted:#9aa1b5;--border:#2d3244;--accent:#818cf8;--accent-text:#12141c;--danger:#f97066;--row:#222638;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#12141c;--surface:#1b1e29;--text:#e8eaf2;--muted:#9aa1b5;--border:#2d3244;--accent:#818cf8;--accent-text:#12141c;--danger:#f97066;--row:#222638;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--surface);border-bottom:1px solid var(--border);z-index:5}
nav{max-width:960px;margin:0 auto;padding:12px 16px;display:flex;gap:8px;align-items:center}
nav strong{margin-right:auto}
nav a{color:var(--text);text-decoration:none;padding:6px 12px;border-radius:8px;font-size:14px}
nav a:hover{background:var(--row)}
main{max-width:960px;margin:0 auto;padding:24px 16px 48px;display:grid;gap:24px}
section{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px}
h2{margin:0 0 4px;font-size:20px}
.sub{margin:0 0 16px;color:var(--muted);font-size:14px}
form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
label{display:grid;gap:6px;font-size:14px;font-weight:600}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea{resize:vertical;min-height:80px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:10px 16px}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
button.danger{color:var(--danger)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.toolbar input{flex:1;min-width:180px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
tbody tr:nth-child(even){background:var(--row)}
.empty{text-align:center;color:var(--muted);padding:28px 0}
.badge{background:var(--row);border:1px solid var(--border);border-radius:999px;padding:2px 10px;font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
@media (max-width:600px){form{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <nav>
    <strong>📋 Registros</strong>
    <a href="#formulario">Formulario</a>
    <a href="#tabla">Tabla (<span id="count">0</span>)</a>
  </nav>
</header>

<main>
  <section id="formulario">
    <h2>Nuevo registro</h2>
    <p class="sub">Completa los datos y pulsa “Guardar”. El registro aparecerá en la tabla de abajo.</p>
    <form id="form" novalidate>
      <label>Nombre completo
        <input name="nombre" type="text" required autocomplete="name" placeholder="Ana Pérez">
      </label>
      <label>Correo electrónico
        <input name="correo" type="email" required autocomplete="email" placeholder="ana@ejemplo.com">
      </label>
      <label>Teléfono
        <input name="telefono" type="tel" autocomplete="tel" placeholder="300 123 4567">
      </label>
      <label>Fecha
        <input name="fecha" type="date" required>
      </label>
      <label class="full">Categoría
        <select name="categoria" required>
          <option value="">Selecciona…</option>
          <option>Consulta</option>
          <option>Soporte</option>
          <option>Ventas</option>
          <option>Otro</option>
        </select>
      </label>
      <label class="full">Mensaje
        <textarea name="mensaje" placeholder="Escribe aquí tus comentarios…"></textarea>
      </label>
      <div class="actions full">
        <button type="submit" class="primary">Guardar registro</button>
        <button type="reset">Limpiar</button>
      </div>
    </form>
  </section>

  <section id="tabla">
    <h2>Registros guardados</h2>
    <p class="sub">Se guardan en este navegador, así que seguirán ahí al recargar la página.</p>
    <div class="toolbar">
      <input id="buscar" type="search" placeholder="Buscar por nombre, correo, categoría…">
      <button id="vaciar" class="danger" type="button">Vaciar todo</button>
    </div>
    <div class="scroll">
      <table>
        <thead>
          <tr><th>#</th><th>Nombre</th><th>Correo</th><th>Teléfono</th><th>Fecha</th><th>Categoría</th><th>Mensaje</th><th></th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>
</main>

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  var KEY = "registros_formulario_v1";
  var registros = [];
  var memoria = null; // respaldo si el almacenamiento no está disponible

  function cargar(){
    try{
      var raw = localStorage.getItem(KEY);
      var data = raw ? JSON.parse(raw) : [];
      return Array.isArray(data) ? data : [];
    }catch(e){ return memoria || []; }
  }
  function guardar(){
    try{ localStorage.setItem(KEY, JSON.stringify(registros)); }
    catch(e){ memoria = registros.slice(); }
  }

  var form = document.getElementById("form");
  var tbody = document.getElementById("tbody");
  var buscar = document.getElementById("buscar");
  var count = document.getElementById("count");
  var toast = document.getElementById("toast");
  var timer;

  function aviso(msg){
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(timer);
    timer = setTimeout(function(){ toast.classList.remove("show"); }, 2200);
  }

  function celda(texto){
    var td = document.createElement("td");
    td.textContent = texto || "—";
    return td;
  }

  function pintar(){
    var q = buscar.value.trim().toLowerCase();
    var lista = registros.filter(function(r){
      return !q || [r.nombre, r.correo, r.telefono, r.categoria, r.mensaje].join(" ").toLowerCase().indexOf(q) !== -1;
    });
    count.textContent = registros.length;
    tbody.textContent = "";

    if(!lista.length){
      var tr = document.createElement("tr");
      var td = document.createElement("td");
      td.colSpan = 8;
      td.className = "empty";
      td.textContent = registros.length ? "Ningún registro coincide con la búsqueda." : "Aún no hay registros. Completa el formulario para añadir el primero.";
      tr.appendChild(td);
      tbody.appendChild(tr);
      return;
    }

    lista.forEach(function(r){
      var tr = document.createElement("tr");
      tr.appendChild(celda(String(registros.indexOf(r) + 1)));
      tr.appendChild(celda(r.nombre));
      tr.appendChild(celda(r.correo));
      tr.appendChild(celda(r.telefono));
      tr.appendChild(celda(r.fecha));
      var tdCat = document.createElement("td");
      var b = document.createElement("span");
      b.className = "badge";
      b.textContent = r.categoria;
      tdCat.appendChild(b);
      tr.appendChild(tdCat);
      tr.appendChild(celda(r.mensaje));
      var tdAcc = document.createElement("td");
      var del = document.createElement("button");
      del.type = "button";
      del.className = "danger";
      del.textContent = "Eliminar";
      del.addEventListener("click", function(){
        registros = registros.filter(function(x){ return x.id !== r.id; });
        guardar(); pintar(); aviso("Registro eliminado");
      });
      tdAcc.appendChild(del);
      tr.appendChild(tdAcc);
      tbody.appendChild(tr);
    });
  }

  form.addEventListener("submit", function(e){
    e.preventDefault();
    var f = new FormData(form);
    var r = {
      id: Date.now() + "-" + Math.random().toString(36).slice(2, 7),
      nombre: String(f.get("nombre") || "").trim(),
      correo: String(f.get("correo") || "").trim(),
      telefono: String(f.get("telefono") || "").trim(),
      fecha: String(f.get("fecha") || ""),
      categoria: String(f.get("categoria") || ""),
      mensaje: String(f.get("mensaje") || "").trim()
    };
    if(!r.nombre || !r.correo || !r.fecha || !r.categoria){
      aviso("Completa los campos obligatorios"); return;
    }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(r.correo)){
      aviso("El correo no parece válido"); return;
    }
    registros.push(r);
    guardar();
    form.reset();
    buscar.value = "";
    pintar();
    aviso("Registro guardado ✔");
    document.getElementById("tabla").scrollIntoView();
  });

  buscar.addEventListener("input", pintar);

  document.getElementById("vaciar").addEventListener("click", function(){
    if(!registros.length) return;
    if(confirm("¿Eliminar todos los registros?")){
      registros = []; guardar(); pintar(); aviso("Tabla vaciada");
    }
  });

  registros = cargar();
  pintar();
})();
</script>
</body>
</html>
